<script>
window.__THP_STATIC={"modules": {"cgm-app": {"body": "센서를 붙였다면 휴대폰과 연결할 차례입니다. 케어센스 에어 앱이 센서에서 혈당을 받고, 더헬스 앱이 그 기록을 가져옵니다. 앞 과정에서 케어센스 에어 앱 설치와 바코드 스캔을 마쳤는지 먼저 확인하세요.\n\n## 연동 방법\n1. 부착한 센서의 **동그란 버튼**을 톡 눌러 앱과 연동하세요. ![](asset:19dd493803cf161e96baf59ef3dbfd7f){tap=50.2,31.4,20.8,37.6}\n2. 연결이 완료되면 **30분간 안정화** 시간을 두고, 케어센스 에어 앱의 알림은 꺼 두세요. ![](asset:49cd08285e9076ddefdef3873da70dea)\n3. 더헬스 앱 하단 **전체** 탭에서 **기기연결**을 선택합니다. ![](asset:5754cafc6f4aa5cd95e37b62931ecdb1){tap=0,41.4,99.7,22.7}\n4. **CGM 혈당기기**의 **연결하기**를 누릅니다. ![](asset:48b2feb0c227a4ec5be2d6531415f170){tap=62,38,28,22}\n5. 더헬스 앱에서 혈당이 표시되는지 확인합니다.\n6. 연동 후에는 **5분 간격**으로 자동 동기화됩니다.\n\n> 연결이 되지 않으면 블루투스를 끄고 다시 켠 뒤 재시도하세요. 자세한 내용은 기기 사용 매뉴얼을 참고하시고, 필요하면 수기 입력도 가능합니다.\n\n> 고객센터(물품 공급 대행사: 카카오헬스케어) 031-629-1156\n> 평일 10:00~17:00 (점심시간 12:00~13:00 제외)", "cover": "49cd08285e9076ddefdef3873da70dea", "device": "cgm", "kicker": "연속혈당측정기 · 앱 연결", "minutes": 3, "order": 3, "quiz": [{"answer": 1, "explain": "부착한 센서의 동그란 버튼을 톡 눌러 앱과 연동합니다.", "options": ["센서 가장자리 테이프", "센서의 동그란 버튼", "어플리케이터 릴리즈 버튼", "휴대폰 전원 버튼"], "q": "센서와 앱을 연동하려면 센서에서 무엇을 누르나요?"}, {"answer": 1, "explain": "연결이 완료되면 30분간 안정화 시간을 둡니다.", "options": ["5분", "30분", "2시간", "하루"], "q": "연결이 완료된 뒤 필요한 안정화 시간은?"}, {"answer": 1, "explain": "더헬스 앱 하단 전체 탭에서 기기연결을 선택하고 CGM 혈당기기의 연결하기를 누릅니다.", "options": ["홈 > 알림", "하단 전체 탭 > 기기연결", "마이 > 결제", "검색"], "q": "더헬스 앱에서 CGM을 연결하는 위치는?"}, {"answer": 1, "explain": "연동 후 5분 간격으로 자동 동기화됩니다.", "options": ["1분", "5분", "1시간", "하루 한 번"], "q": "연동 후 혈당 기록은 얼마나 자주 동기화되나요?"}], "source": "연속혈당측정기(CGM) 사용 안내서(B2B, 2026.10.22)", "status": "published", "summary": "센서와 케어센스 에어 앱을 연결하고, 더헬스 앱에서 혈당이 보이기까지.", "title": "CGM 앱 연동하기", "updatedAt": 1792630000000, "video": null, "videoTitle": ""}, "bp-app": {"body": "혈압계를 **OMRON Connect** 앱에 연결한 뒤, 삼성헬스(안드로이드) 또는 애플 건강(아이폰)을 거쳐 더헬스 앱에 연동합니다. 두 단계로 나눠 진행하세요.\n\n## 연동 1 · 혈압계 ↔ OMRON Connect 앱\n1. OMRON Connect 앱을 설치하고 **시작합니다**를 누르세요. ![](asset:851441cf5bcc42fc1dcb864434af5068){hl=34.1,87.9,31.7,5.8}\n2. 기기 연결 권한 요청에서 **허용**을 누르세요. ![](asset:183f0a55eb4c8fb36f7f15a567b4461f){hl=36.9,79.1,26.3,5.8}\n3. **등록 시작**을 누르세요. ![](asset:cb244856bd7dc5db1881eb463aedd361){hl=12.2,85.4,76.9,7.7}\n4. 기기 선택에서 **혈압계**를 누르세요. ![](asset:782fc17d92224a68eb132b7565fc8154){hl=0,19.6,19.4,5.8}\n5. 혈압계가 꺼진 상태에서 **P** 표시가 나타날 때까지 블루투스 버튼을 길게 누르세요. ![](asset:de0df0722ebc6902de9d90c3610d2aee)\n6. 기기가 발견되면 **등록하기**를 누르세요. ![](asset:265d2c6cff98c20a1bb66702639d4a1b){hl=12.2,85.4,76.9,7.7}\n7. 블루투스 연결요청에서 **등록**을 누르세요. ![](asset:a967b6fa1694809e7f7514e0caa3fc14){hl=57.4,84.7,27.6,5.8}\n8. 등록 완료가 표시되면 **OK**를 누르세요. ![](asset:7ab5bb959625ee4dcd50b07e44b229f1){hl=12.2,85.4,76.9,7.7}\n\n## 연동 2 · 삼성헬스와 연결 (갤럭시·안드로이드)\n안드로이드 휴대폰은 OMRON Connect 앱을 **삼성헬스**와 연결하면 완료돼요. 아이폰은 다음 순서를 봐주세요.\n1. OMRON Connect 앱 하단 **콘텐츠**를 누르세요. ![](asset:894e5771247ac397a7c7d7adffe03842){hl=30.0,88.6,15.7,5.8}\n2. 오른쪽 위 **+** 버튼을 누르세요. ![](asset:83fe7f228eb244b42d1cb56383eb5cb5){hl=76.9,5.0,11.1,5.8}\n3. 화면 맨 아래 **연결된 앱 및 서비스**를 누르세요. ![](asset:fead734d05633c5eba44e4ace719bd8f){hl=2.3,83.0,95.3,6.9}\n4. 목록에서 **Samsung Health**를 누르세요. ![](asset:9b46f85cb204005868ec12cb4d811cd4){hl=1.1,31.6,53.2,8.6}\n5. **데이터 공유**를 켜세요. ![](asset:c5629a4b9dc7e7d7a15ce06902f5da7a){hl=81.8,38.9,17.0,5.8}\n6. 데이터 공유 요청 화면에서 **동의함**을 누르세요. ![](asset:a3367121e36cb17f442a65f7615700a1){hl=11.9,85.8,76.0,7.5}\n7. 모든 권한을 켜고 **완료**를 누르세요. ![](asset:fa2997d0912fccf6d766766bf4df2a58){hl=80.5,17.5,13.5,5.2;62.5,85.3,17.1,5.2}\n\n## 연동 2 · 애플 건강과 연결 (아이폰)\n아이폰은 **애플 건강** 앱과 연동해요. 콘텐츠 → + 버튼까지는 안드로이드와 같아요.\n1. OMRON Connect 앱 하단 **콘텐츠**를 누르세요. ![](asset:894e5771247ac397a7c7d7adffe03842){hl=30.0,88.6,15.7,5.8}\n2. 오른쪽 위 **+** 버튼을 누르세요. ![](asset:83fe7f228eb244b42d1cb56383eb5cb5){hl=76.9,5.0,11.1,5.8}\n3. **Apple 건강 앱과 건강 데이터 공유**에서 **연동 설정**을 누르세요. ![](asset:f7e223093a21fe3c4651a031d0229935){hl=18.0,67.2,64.1,6.9}\n4. 안내 화면에서 **동의함**을 누르세요. ![](asset:40e07ac07e7907303899a23de370fa62){hl=15.7,86,67.7,6.2}\n5. **2개의 주제 모두 선택**을 눌러 심박수와 혈압 데이터를 허용해 주세요. ![](asset:f9d6100d914a8f23d2a092472398bc30){hl=8.6,47.3,82.3,5.8}\n\n+> 심박수·혈압 항목이 녹색으로 켜지면 애플 건강 연동이 끝난 거예요.\n\n> 연결이 되지 않으면 블루투스를 끄고 다시 켠 뒤 재시도하세요. 자세한 내용은 기기 사용 매뉴얼을 참고하시고, 필요하면 수기 입력도 가능합니다.\n\n> 고객센터(물품 공급 대행사: 카카오헬스케어) 031-629-1156\n> 평일 10:00~17:00 (점심시간 12:00~13:00 제외)", "cover": "851441cf5bcc42fc1dcb864434af5068", "device": "bp", "kicker": "가정용 혈압계 · 앱 연결", "minutes": 6, "order": 4, "quiz": [{"answer": 1, "explain": "혈압계는 먼저 OMRON Connect 앱에 연결합니다.", "options": ["케어센스 에어", "OMRON Connect", "앳플리", "카카오톡"], "q": "혈압계를 처음 연결할 앱은?"}, {"answer": 1, "explain": "혈압계가 꺼진 상태에서 P 표시가 나타날 때까지 블루투스 버튼을 길게 누릅니다.", "options": ["SYS", "P", "OK", "0.00"], "q": "혈압계를 앱에 등록할 때 혈압계 화면에 무엇이 나타날 때까지 블루투스 버튼을 길게 누르나요?"}, {"answer": 0, "explain": "하단 콘텐츠 → 오른쪽 위 + 버튼 → 연결된 앱 및 서비스 → Samsung Health 순서입니다.", "options": ["하단 콘텐츠 > + 버튼 > 연결된 앱 및 서비스", "설정 > 계정 삭제", "홈 > 측정 시작", "알림 > 공지사항"], "q": "OMRON Connect에서 삼성헬스 연결을 시작하는 위치는?"}, {"q": "아이폰 사용자는 OMRON Connect 앱을 어떤 앱과 연동하나요?", "options": ["삼성헬스", "애플 건강", "앳플리", "케어센스 에어"], "answer": 1, "explain": "아이폰은 애플 건강 앱과 연동해요. 콘텐츠 → + 버튼까지는 안드로이드와 같고, 이후 연동 설정 → 동의함 → 2개의 주제 모두 선택 순서로 진행합니다."}], "source": "가정용 혈압계 사용 안내서(B2B, 2026.10.22) · 혈압계 연동 및 측정 방법 영상 v3(아이폰 포함)", "status": "published", "summary": "혈압계를 OMRON Connect 앱에 등록하고, 삼성헬스(안드로이드)·애플 건강(아이폰)으로 데이터를 보내는 방법.", "title": "혈압계 앱 연동하기", "updatedAt": 1792630000000, "video": "35577821b5b8ee6db2bb4cbf398ac9c2", "videoTitle": "혈압계와 앱 연동하기 (안드로이드·아이폰)"}, "scale": {"body": "앳플리 T9은 발바닥이 닿는 금속 전극으로 체중과 체성분을 함께 재는 스마트 체성분 체중계입니다. 블루투스가 내장되어 있어 측정값이 앱으로 자동 전송됩니다.\n\n## 상자에 들어 있는 것\n![체중계 본체](asset:a459afa98f882a9c850ace7fdeb4f3c8)\n![건전지 (AAA)](asset:75176b48b026f0f6c1963237daad18ca)\n![사용설명서·보증서](asset:6bb04e8056ebe1ded3f5a2e1fb65e1b5)\n\n## 본체 구조\n![전자극판 · 상태표시 패널](asset:0d182a17f400ad1d76f38796f45bca7a)\n- 상판의 금속 전극이 발바닥과 닿아야 체성분이 측정됩니다.\n- 올라서면 자동으로 전원이 켜지고, 측정이 끝나면 꺼집니다.\n\n## 측정 방법\n단단한 바닥에 체중계를 놓고, **맨발**로 올라서서 측정합니다.\n1. 체중계에 잠시 올라가거나 발로 살짝 힘을 주면 체중계가 켜집니다. ![](asset:692818e2a71df0c5a52de8458d9c9793)\n2. 체중계에서 내려오세요. 화면에 **0.00kg(영점)**이 표시되면 측정 준비가 끝난 것입니다. ![](asset:3bf6963765bf752d94fd33a08c00f30f)\n3. 맨발로 올라가 양발을 전극에 맞춰 섭니다. 숫자가 **3번 깜빡이면** 측정이 완료됩니다. ![](asset:0351ebc1f19aebdb7fe0d0f2fda09a7d)\n\n## 측정할 때 주의하세요\n- 양말·스타킹을 신은 상태에서는 체성분이 측정되지 않습니다.\n- 매일 같은 시간에 측정하면 추이를 보기 좋습니다.\n- 측정값은 체성분 추정치입니다. 절대 수치보다 변화의 흐름을 보세요.\n- 체성분 수치는 몸 수분 상태에 따라 달라집니다. 같은 조건에서 측정한 추이를 보세요.\n- **올바른 다리 모양:** 허벅지가 붙지 않은 상태로 측정해 주세요. 허벅지가 붙는다면 바지를 입고 측정하기를 권장합니다.\n- **올바른 발 모양:** 발 뒤꿈치가 서로 붙지 않도록 전극에 발을 잘 맞춰 서 주세요.\n\n## 연동 1 · 체중계 ↔ 앳플리 앱\n1. 앳플리 앱 홈 화면에서 **+** 버튼을 누르세요. ![](asset:3fc7d1d4af473d44b666583ac59823a3){hl=39.7,88.7,21.6,9.9}\n2. 새로 나타난 화면에서 **측정**을 누르세요. ![](asset:2ca18def1bd20dba0f846c946c80fa69){hl=7.1,79.4,22.6,9.9}\n3. **스마트 기기 추가하기** 버튼을 누르세요. ![](asset:272c919f6078a43b5814bf506c838dbf){hl=3.0,79.4,94.0,8.0}\n4. 체중계에 발을 올려 앱이 체중계를 인식하게 하세요. ![](asset:6de91f373628f0a4296b44278d203e6a)\n5. 인식된 체중계를 선택하고 **추가하기**를 누르세요. ![](asset:c6337ce1ae15bfa842de6b53302968fc){hl=3.0,32.7,94.1,14.1;3.0,87.8,94.0,8.5}\n6. **추가 완료** 화면이 나오면 연동이 끝납니다. ![](asset:9fce463d0a802c93278e380dc0be119b){hl=3.0,80.8,94.0,8.0}\n\n## 연동 2 · 앳플리 앱 ↔ 삼성헬스/애플건강\n1. 앳플리 앱 홈 화면의 **사람 모양 아이콘**을 누르세요. ![](asset:d9c2b5f74b744cbc9ed8d6dc01d3cd46){hl=82.8,4.3,15.8,7.4}\n2. 화면 하단 메뉴에서 **건강 데이터 연동**을 누르세요. ![](asset:f8cbdf0caa2c7416fa16b449a329cc52){hl=3.1,69.3,93.9,8.2}\n3. **삼성헬스 연동**을 누르세요. ![](asset:3f480a72b19616f03aa4a1d526cfb115){hl=1.5,85.3,95.6,8.9}\n4. **모든 권한** 버튼을 눌러 권한을 허용해 주세요. ![](asset:f619041fa8e8246ddd51dbca513154ee){hl=78.0,16.7,15.9,6.0}\n5. 버튼이 **삼성헬스 연동됨**으로 바뀌면 완료된 것입니다. ![](asset:8560a99388e3dbde5a5460414b39bb6e){hl=1.5,85.3,95.6,8.9}\n\n> 아이폰 사용자는 애플 건강 앱에서 다음 경로로 연동해 주세요.\n> 우측 상단 프로필 아이콘 > 개인정보 보호의 '앱' > '앳플리' > '접근 권한 변경' > '주제 모두 선택' > 화면 하단 '계속' > 희망하는 데이터 연동 기간 선택 > '완료'\n\n> 연결이 되지 않으면 블루투스를 끄고 다시 켠 뒤 재시도하세요. 자세한 내용은 기기 사용 매뉴얼을 참고하시고, 필요하면 수기 입력도 가능합니다.\n\n## 이용 시 주의사항\n- 본 제품을 이용한 체성분 측정은 의료기관의 진료나 검사를 대체하지 않습니다.\n- 투석·심장·혈관 관련 치료를 받는 경우 담당 의사 또는 전문가와 상담해 사용하세요.\n\n!> 심박 조절기(Pacemaker), 이식형·전자 의료기기처럼 생명 유지에 필수적인 의료기기가 장착된 분은 사용하지 마세요.\n\n> 고객센터(물품 공급 대행사: 카카오헬스케어) 031-629-1156\n> 평일 10:00~17:00 (점심시간 12:00~13:00 제외)", "cover": "5cf9b13f6d1dd1c1ee34b3afa01538dd", "device": "scale", "kicker": "스마트 체성분 체중계 · 앳플리 T9", "minutes": 6, "order": 6, "quiz": [{"answer": 1, "explain": "양말·스타킹을 신으면 체성분이 측정되지 않습니다. 맨발로 전극에 맞춰 섭니다.", "options": ["양말을 신고", "맨발로", "슬리퍼를 신고", "한 발로"], "q": "체성분을 정확히 재려면 어떻게 올라서나요?"}, {"answer": 0, "explain": "한 번 켠 뒤 내려와 0.00kg(영점)이 표시되면 측정 준비가 끝난 것입니다.", "options": ["화면에 0.00kg(영점) 표시", "숫자 3번 깜빡임", "삐 소리 두 번", "화면 꺼짐"], "q": "측정 준비가 끝났다는 표시는?"}, {"answer": 1, "explain": "숫자가 3번 깜빡이면 측정이 완료됩니다.", "options": ["화면이 바로 꺼진다", "숫자가 3번 깜빡인다", "0.00kg이 표시된다", "앱 알림이 온다"], "q": "측정이 끝났다는 표시는?"}, {"answer": 2, "explain": "심박 조절기 등 생명 유지에 필수적인 의료기기를 장착한 분은 사용하지 않습니다.", "options": ["아침에 재는 사람", "바지를 입은 사람", "심박 조절기를 장착한 사람", "매일 재는 사람"], "q": "이 체중계를 사용하면 안 되는 사람은?"}], "source": "스마트 체성분 체중계 사용 안내서(B2B, 2026.10.22) · 앳플리 T9 연동 및 측정 방법 영상 v6", "status": "published", "summary": "맨발로 올라서는 측정 3단계와 앳플리 앱, 삼성헬스·애플건강 연동까지.", "title": "체성분계 측정·앱 연동하기", "updatedAt": 1792630000000, "video": "7ff5db034745c8dcc49b8749315f8a7a", "videoTitle": "앳플리 T9 연동 및 측정 방법"}, "cgm-attach": {"body": "케어센스 에어는 위팔에 붙인 작은 센서가 혈당을 계속 측정해 휴대폰으로 보내 주는 개인용 연속혈당측정시스템입니다. 센서 하나는 **15일** 동안 사용합니다.\n\n!> 배송받은 CGM은 바로 착용하지 마시고, 더헬스 프라임 **시작 전날**에 착용하세요.\n\n## 상자에 들어 있는 것\n![제품 박스](asset:55d39d490ae647f77994e17a8cad3fa6)\n![어플리케이터 (센서 포함)](asset:1c975fd0348d468f1fb474fe990f269d)\n![사용자 매뉴얼](asset:c0f6d3a7a46f037ec5008ff85a0235fe)\n![알코올 솜 & 착용 테이프](asset:046089522572d9f8180c2f38f904eeb4)\n\n## 어플리케이터 구조\n![위에서부터 릴리즈 버튼 · 센서 · 세이프티 캡](asset:c6392e179bbddce4eb04acd33887a2a9){30%}\n- 센서는 어플리케이터 내부에 내장되어 있어 따로 준비할 필요가 없습니다.\n- 입구의 세이프티 캡이 센서의 오작동·오방출을 막아 줍니다.\n- 부착 직전까지 세이프티 캡을 제거하지 마세요.\n\n## 착용 방법\n센서는 **위팔 뒤쪽 상단**에 부착합니다. 어려우면 후면에 가까운 옆면도 가능합니다.\n1. 앱스토어 또는 Play 스토어에서 **케어센스 에어** 앱을 설치하고 가입하세요. ![](asset:d158855d409a790a6148418e8b4ab040)\n2. **신규 연결**을 누르고 센서 포장 라벨의 바코드를 스캔하세요. ![](asset:dbec2c7998b084d138633ce70e4205f8)\n3. 알코올 솜으로 부착 부위를 소독하고 완전히 건조시킵니다. ![](asset:fce9ecdc42971cdf7fd6e14a0b272e02)\n4. 어플리케이터를 **수평 방향**으로 부착 부위 위에 위치시킵니다. ![](asset:9fc65b205ff10203e32b75c609b76f53)\n5. 위치를 확인한 뒤 버튼을 눌러 센서를 부착합니다. ![](asset:727cbf5140c09362543ecb2e08878a71)\n6. 센서 주변 테이프를 손으로 눌러 고정하면 부착이 완료됩니다. ![](asset:baa88a76033ebbbc480cc2b0f4f13590)\n\n## 부착할 때 주의하세요\n- 소독 후 완전히 마르지 않은 상태에서 부착하면 정확도가 낮아지고 센서가 쉽게 떨어질 수 있습니다.\n- 어플리케이터를 세로 방향으로 놓으면 센서가 제대로 부착되지 않을 수 있으니 수평을 유지하세요.\n- 부착 부위를 정하기 전까지 어플리케이터의 릴리즈 버튼을 절대 누르지 마세요.\n- 센서 안정화 중 즉시 치료 결정이 필요하면 개인용 혈당측정기 수치를 사용하세요.\n\n## 사용 중 주의사항\n- 피부 문제가 있는 부위, 주사·시술 부위, 문신 부위는 피해 부착하세요.\n- 부착 후 48시간 이내이거나 자세 등으로 센서가 압박되는 경우 혈당이 실제보다 더 낮게 측정될 수 있습니다.\n- 센서 장착 부위에 멍이 들거나 통증 및 출혈이 심한 경우 사용을 중단하고 센서를 제거한 후 즉시 의사 또는 의료 전문가와 상담하세요.\n- 본 제품을 이용한 혈당 측정은 의료기관의 진료를 대체할 수 없으며 당뇨병을 진단하기 위한 목적으로 사용하지 않습니다.\n\n!> 다음 대상은 사용하지 마세요. 만 19세 미만 영유아·어린이, 임산부·수유부, 투석 환자·위독한 환자는 안전성·유효성이 확립되지 않아 사용 대상에서 제외됩니다.\n\n## 이런 경우 새 센서로 교체하세요\n- 15일 사용 기한 만료 시\n- 유효기간 전 센서 탈락 시\n- 신호 이상 지속 시\n\n!> 다음의 경우 센서를 사용하지 마시고, 부착한 센서를 제거하세요.\n!> MRI 촬영 · CT 촬영 · X-RAY 촬영 · 고주파 열 치료 · 통열 요법 · 고집적 초음파 치료\n\n> 고객센터(물품 공급 대행사: 카카오헬스케어) 031-629-1156\n> 평일 10:00~17:00 (점심시간 12:00~13:00 제외)", "cover": "453c48d48dd59cf09265ebaf8f7150ab", "device": "cgm", "kicker": "연속혈당측정기 · 케어센스 에어", "minutes": 6, "order": 2, "quiz": [{"answer": 1, "explain": "배송받은 CGM은 바로 착용하지 말고 더헬스 프라임 시작 전날에 착용합니다.", "options": ["받자마자 바로", "더헬스 프라임 시작 전날", "프로그램 시작 1주일 후", "병원 방문 후"], "q": "배송받은 CGM은 언제 착용하나요?"}, {"answer": 1, "explain": "위팔 뒤쪽 상단에 부착합니다. 어려우면 후면에 가까운 옆면도 가능합니다.", "options": ["배꼽 주변", "위팔 뒤쪽 상단", "손목 안쪽", "허벅지 앞쪽"], "q": "센서를 붙이는 기본 위치는 어디인가요?"}, {"answer": 1, "explain": "마르지 않은 상태에서 붙이면 정확도가 낮아지고 센서가 쉽게 떨어질 수 있습니다.", "options": ["젖은 상태로 바로 붙인다", "완전히 건조시킨 뒤 붙인다", "물로 한 번 더 닦는다", "로션을 바른다"], "q": "알코올 솜으로 소독한 뒤에는?"}, {"answer": 2, "explain": "세로로 놓으면 센서가 제대로 부착되지 않을 수 있어 수평을 유지해야 합니다.", "options": ["세로 방향", "비스듬히", "수평 방향", "상관없다"], "q": "어플리케이터는 어떤 방향으로 대야 하나요?"}, {"answer": 2, "explain": "이 경우 센서를 사용할 수 없으므로 부착한 센서를 제거해야 합니다.", "options": ["센서를 붙인 채 받는다", "테이프를 더 붙인다", "부착한 센서를 제거한다", "앱 알림만 끈다"], "q": "MRI·CT·X-RAY 촬영이나 고주파 열 치료가 있다면?"}], "source": "연속혈당측정기(CGM) 사용 안내서(B2B, 2026.10.22) · CGM 부착 방법 영상 v4", "status": "published", "summary": "구성품 확인, 케어센스 에어 앱 준비, 위팔 뒤쪽에 센서를 붙이는 방법과 사용 시 주의사항.", "title": "CGM 착용하기", "updatedAt": 1792630000000, "video": "647e2dc964eb86d5746a6134008c34fa", "videoTitle": "케어센스 에어 센서 부착 방법"}, "bp-measure": {"body": "오므론 HEM-7142T2는 팔뚝에 커프를 감아 재는 가정용 전자 혈압계입니다. 블루투스가 내장되어 있어 측정값이 앱으로 자동 전송됩니다.\n\n## 상자에 들어 있는 것\n![혈압계 본체](asset:05bd7691a497cd950375bfddf910a47d)\n![커프 (암밴드)](asset:e3ae735f08471fbb40821eaa45e52964)\n![AA 건전지 4개](asset:66a946dec5b2c06806935ace758fc8de)\n![사용설명서·보증서](asset:e384eb3a827a3cdd69062c6c11dddc06)\n\n## 본체 구조\n![표시부 · 연결 버튼(메모리) · 시작/정지 버튼](asset:a1ca5c33dc273d9c5c21db1eed960753)\n- **표시부:** 측정값이 표시됩니다.\n- **연결 버튼(메모리):** 앱 연결과 기록 확인에 씁니다.\n- **시작/정지 버튼:** 버튼 하나로 측정을 시작하고 멈출 수 있습니다.\n- 커프 연결관은 본체 측면 공기 소켓에 끝까지 밀어 넣으세요.\n\n## 측정 방법\n**왼팔 위쪽**에 커프를 감고, 등을 기댄 채 팔을 **심장 높이**에 두고 측정합니다.\n?> 측정 전 준비가 되었나요?\n[ ] 측정 전 5분간 편안히 쉬었어요\n[ ] 흡연·운동·목욕·식사·카페인 섭취 후 30분 이상 지났어요\n[ ] 등을 기대고 바르게 앉았어요\n1. 커프의 에어 플러그를 본체의 커프 커넥터에 정확히 끼워 넣습니다. ![](asset:4423e0e7b7e93cd578eeaec488e29afc)\n2. 손바닥을 위로 향하게 한 뒤 왼팔에 커프를 착용합니다. ![](asset:dd70fd9c4f5874526d1d6fbd249c35a6)\n3. 호스는 뒤집히지 않게 아래로 내리고, 가운데 손가락 연장선에 오도록 합니다. ![](asset:8ba5de5451ba20c8c5095c23c4b42041)\n4. 팔꿈치에서 손가락 두 마디(1~2cm) 위에 오도록 커프를 감습니다. ![](asset:a2268a819125452585ddcfdf63414ff9)\n5. 바르게 앉아 몸이 앞으로 숙여지거나 복부에 압력이 생기지 않도록 하고, 팔을 심장 높이에 둡니다. ![](asset:af9e25a2577d0ceb2a311a15f02fbb0d)\n6. **START** 버튼을 누르고 움직이지 않습니다. ![](asset:37e80dcf71a16c6e75bb00df0842b36e)\n\n## 측정할 때 주의하세요\n- 측정 전 5분간 안정을 취하고, 측정 중에는 말하거나 움직이지 마세요.\n- 흡연·운동·목욕·식사·카페인 섭취 직후에는 30분 이상 지난 뒤 측정하세요.\n- 커프는 손가락 두 개가 들어갈 정도로 감고, 공기관이 꺾이지 않게 두세요.\n- 매일 같은 시간(아침 기상 후·취침 전)에 같은 팔로 측정하면 추이를 보기 좋습니다.\n\n!> 본 제품을 이용한 혈압 측정은 의료기관의 진료를 대체할 수 없으며 고혈압을 진   --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r-card:20px; --r-btn:16px; --r-input:14px; --r-sm:15px;
  --col:480px; --pad:20px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:16px;line-height:1.55;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
@media (min-width:600px){ html,body{background:var(--sec)} }
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
a{color:var(--blue);text-decoration:none}
h1,h2,h3{color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
svg{flex:none}

.app{max-width:var(--col);margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.app.wide{max-width:1100px}
@media (min-width:600px){ .app{box-shadow:var(--shadow)} }
.gut{padding-left:max(var(--pad),env(safe-area-inset-left,0px));padding-right:max(var(--pad),env(safe-area-inset-right,0px))}
.view{animation:viewIn .2s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* top bars */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg)}
.top-in{display:flex;align-items:center;gap:8px;min-height:56px}
.logo{font-weight:700;font-size:16px;color:var(--blue);letter-spacing:-.01em}
.logo span{color:var(--ink);font-weight:600;margin-left:4px}
.top .sp{flex:1}
.iconbtn{width:40px;height:40px;margin-left:-10px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--sec)}
.modes{display:flex;background:var(--sec);border-radius:12px;padding:3px}
.modes button{border:0;background:none;padding:6px 10px;border-radius:10px;font-size:13px;font-weight:600;color:var(--sub)}
.modes button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:var(--shadow)}
.lhead .top-in{gap:4px}
.lhead .cat{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .pos{font-size:14px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.lhead .pos b{color:var(--blue)}
.thin{height:3px;background:var(--line)}
.thin i{display:block;height:100%;background:var(--blue);border-radius:0 3px 3px 0;transition:width .3s ease}

/* content rhythm */
.page{padding-block:20px 140px;display:grid;gap:32px}
.stack{display:grid;gap:10px}
.eyebrow{font-size:14px;font-weight:600;color:var(--blue)}
.t-main{font-size:28px;line-height:1.35;font-weight:700}
.t-sec{font-size:21px;line-height:1.4;font-weight:700}
.t-card{font-size:17px;line-height:1.45;font-weight:700;color:var(--ink)}
.lead{font-size:16px;color:var(--body);line-height:1.6}
.cap{font-size:14px;color:var(--sub);line-height:1.5}

/* buttons */
.cta-bar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:var(--col);z-index:7;background:var(--bg);padding:12px max(var(--pad),env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(var(--pad),env(safe-area-inset-left,0px));display:grid;gap:10px;box-shadow:0 -8px 16px rgba(255,255,255,.9)}
.cta{min-height:56px;width:100%;border:0;border-radius:var(--r-btn);background:var(--blue);color:#fff;font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s ease,background .15s ease}
.cta:active{transform:scale(.98);background:var(--blue-press)}
.cta:disabled{background:var(--line);color:var(--hint);cursor:default;transform:none}
.cta.soft{background:var(--blue-50);color:var(--blue)}
.cta.soft:active{background:#dfe8ff}
.tact{border:0;background:none;padding:6px;font-size:15px;color:var(--sub);text-align:center}
.tact b{color:var(--blue);font-weight:600}

/* landing */
.land-hero{border-radius:var(--r-card);overflow:hidden;background:var(--blue-50);margin-inline:calc(-1 * max(var(--pad),env(safe-area-inset-left,0px)) + 8px)}
.land-hero img{display:block;width:100%;height:auto;aspect-ratio:1167/1347}
.land-copy .t-main{font-size:30px}
.flow3{display:grid;gap:14px}
.flow3 li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.flow3 ol{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.num{font-weight:700;color:var(--blue);font-size:15px;font-variant-numeric:tabular-nums;min-width:24px;line-height:1.55}
.flow3 .k{font-size:13px;font-weight:600;color:var(--sub)}
.flow3 .v{font-size:16px;color:var(--ink);font-weight:500}

/* code */
.codein{width:100%;min-height:56px;border:0;border-radius:var(--r-input);background:var(--sec);padding:0 18px;font-size:19px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);outline:2px solid transparent;transition:outline-color .15s}
.codein::placeholder{color:var(--hint);letter-spacing:.02em;font-weight:500}
.codein:focus{outline:2px solid var(--blue);background:var(--bg)}
.codein.bad{outline:2px solid var(--err)}
.errtxt{color:var(--err);font-size:14px;margin-top:8px}
.okcircle{width:72px;height:72px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both}
.okcircle.lg{width:96px;height:96px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.center{display:grid;justify-items:center;text-align:center;gap:12px;padding-top:48px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;line-height:1;padding:7px 10px;border-radius:10px;background:var(--sec);color:var(--sub);white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.chip.blue{background:var(--blue-50);color:var(--blue)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}

/* orientation */
.osteps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.osteps li{background:var(--sec);border-radius:var(--r-sm);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.osteps .num{font-size:17px}
.osteps strong{font-size:17px;color:var(--ink);font-weight:600}
.osteps small{display:block;font-size:14px;color:var(--sub);margin-top:2px}

/* home */
.pcard{background:var(--blue-50);border-radius:var(--r-card);padding:22px;display:grid;gap:14px}
.pcard .row1{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pcard .lbl{font-size:15px;font-weight:600;color:var(--body)}
.pcard .cnt{font-size:15px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.pcard .cnt b{color:var(--ink)}
.pct{font-size:34px;font-weight:700;color:var(--blue);line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.bar{height:10px;border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.nextbox{background:var(--bg);border-radius:var(--r-sm);padding:16px;display:grid;gap:12px}
.nextbox .k{font-size:13px;font-weight:600;color:var(--sub)}
.nextbox .t-card{margin-top:2px}
.lessons{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.grp{font-size:14px;font-weight:600;color:var(--sub);margin:10px 0 -2px}
.grp:first-child{margin-top:0}
.lcard{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:18px;border-radius:var(--r-card);background:var(--sec);color:inherit;transition:transform .15s ease,background .15s ease}
.lcard:active{transform:scale(.985);background:#f0f2f6}
.lcard .num{grid-row:1/4;font-size:16px}
.lcard .t-card{grid-column:2}
.lcard .d{grid-column:2;font-size:14px;color:var(--sub);line-height:1.5}
.lcard .foot{grid-column:2;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.lcard .meta{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.st{font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.st.done{color:var(--blue)}
.st.go{color:var(--blue)}
.st.new{color:var(--body)}
.lcard.isdone{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.lcard.isdone .num{color:var(--hint)}
.mine{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--sub)}
.mine button{border:0;background:none;color:var(--sub);text-decoration:underline;font-size:14px;padding:4px}
.foottxt{font-size:13px;color:var(--hint);line-height:1.6}

/* lesson blocks */
.lp{display:grid;gap:20px;padding-block:24px 150px}
.lp .t-main{font-size:26px}
.prose{display:grid;gap:12px;font-size:16px;line-height:1.6;color:var(--body)}
.prose h3{font-size:17px;font-weight:700;margin-top:8px}
.prose strong{color:var(--ink);font-weight:700}
.prose ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.prose ul li{position:relative;padding-left:16px}
.prose ul li::before{content:"";position:absolute;left:2px;top:.68em;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.hero{border-radius:var(--r-card);background:var(--blue-25);padding:16px;display:grid;place-items:center;cursor:zoom-in;position:relative}
.hero img{display:block;max-width:100%;max-height:min(46vh,400px);width:auto;height:auto;object-fit:contain;border-radius:12px}
.hero.tall img{max-height:min(48vh,500px);box-shadow:var(--shadow)}
.hero .zoomhint{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--sub)}
.iw{position:relative;display:inline-block;max-width:100%;line-height:0}
.iw img{display:block}
.mk-hl{position:absolute;border:2.5px dashed #FF5A1F;border-radius:8px;box-shadow:0 0 0 2px rgba(255,255,255,.75);pointer-events:none}
.mk-tap{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:none}
.mk-tap::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #FF5A1F;opacity:0;animation:tapRing 1.8s ease-out infinite;animation-delay:var(--d,0s)}
.mk-tap::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:rgba(255,90,31,.9);box-shadow:0 0 0 3px rgba(255,255,255,.85);animation:tapDot 1.8s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes tapRing{0%{transform:scale(.35);opacity:0}12%{opacity:.95}70%{transform:scale(1.35);opacity:0}100%{opacity:0}}
@keyframes tapDot{0%{transform:scale(1.3);opacity:0}10%{transform:scale(1);opacity:1}22%{transform:scale(.8)}45%{transform:scale(1);opacity:1}70%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.mk-tap::before{animation:none;opacity:.9;transform:scale(1)}.mk-tap::after{animation:none;opacity:1}}
.figgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.figgrid.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.figgrid figure{margin:0;display:grid;gap:8px;min-width:0;align-content:start}
.figgrid .hero{display:block;aspect-ratio:1;width:100%;padding:12px;overflow:hidden}
.figgrid .hero img,.figgrid .hero.tall img{width:100%;height:100%;max-height:none;object-fit:contain;box-shadow:none;border-radius:8px}
.figgrid .hero .zoomhint{width:28px;height:28px;right:8px;bottom:8px}
.figgrid.three figcaption{font-size:13px}
.hero{min-width:0}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;line-height:1.5}
.sechead .eyebrow{white-space:nowrap}
.seclead{font-size:14px;color:var(--sub);flex:1 1 200px;min-width:0}
.seclead strong{color:var(--ink);font-weight:600}
.figgrid figcaption{font-size:15px;font-weight:600;color:var(--ink);text-align:center;line-height:1.4}
.figcap{font-size:14px;color:var(--sub);text-align:center;margin-top:-10px}
.stepnum{font-size:15px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.steptxt{font-size:20px;line-height:1.5;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.steptxt strong{color:var(--blue)}
.ministeps{display:grid;gap:12px}
.ministeps > div{background:var(--sec);border-radius:var(--r-sm);padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:12px;font-size:16px;color:var(--ink);font-weight:500}
.note{border-radius:var(--r-sm);padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;background:var(--blue-25)}
.note .ic{color:var(--blue);grid-row:1/3;margin-top:1px}
.note .nl{font-size:14px;font-weight:700;color:var(--blue)}
.note .nb{font-size:15px;line-height:1.6;color:var(--body)}
.note.warn{background:var(--warn-bg)} .note.warn .ic,.note.warn .nl{color:var(--warn)}
.note.ok{background:var(--ok-bg)} .note.ok .ic,.note.ok .nl{color:var(--ok)}
.picks{display:grid;gap:10px}
.pick{min-height:60px;width:100%;border:0;border-radius:var(--r-sm);background:var(--sec);padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;font-size:16px;font-weight:500;color:var(--ink);transition:background .15s ease,transform .15s ease}
.pick:active{transform:scale(.99)}
.pick .mk{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px #C9CED8;display:grid;place-items:center;color:#fff}
.pick[aria-pressed="true"]{background:var(--blue-50);color:var(--blue);font-weight:600}
.pick[aria-pressed="true"] .mk{background:var(--blue);box-shadow:none}
video{display:block;width:100%;aspect-ratio:16/9;border-radius:16px;background:#000}
.vstat{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.vbar{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--blue);transition:width .3s ease}
.qhead{display:grid;gap:10px}
.qhead .cap b{color:var(--blue)}
.qdots{display:flex;gap:6px}
.qdots i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.qdots i.on{background:var(--blue)}
.opt{width:100%;min-height:58px;border-radius:var(--r-sm);border:0;background:var(--bg);box-shadow:inset 0 0 0 1px #E1E4EA;padding:14px 18px;text-align:left;font-size:16px;line-height:1.5;color:var(--ink);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;transition:background .15s,box-shadow .15s}
.opt[aria-pressed="true"]{background:var(--blue-50);box-shadow:inset 0 0 0 2px var(--blue);font-weight:600}
.opt.right{background:var(--blue-50);box-shadow:inset 0 0 0 2px var(--blue);color:var(--blue);font-weight:600}
.opt.wrong{background:var(--bg);box-shadow:inset 0 0 0 2px var(--err);color:var(--ink)}
.opt:disabled{cursor:default}
.verdict{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
.verdict.y{color:var(--blue)} .verdict.n{color:var(--err)}
.explain{font-size:15px;color:var(--body);line-height:1.6;margin-top:-8px}
.remain{display:grid;gap:10px}
.remain button{width:100%;border:0;border-radius:var(--r-sm);background:var(--sec);min-height:56px;padding:0 18px;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;color:var(--ink)}
.survey-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.survey-opts .pick{grid-template-columns:1fr;justify-items:center;text-align:center;min-height:96px;gap:6px;font-size:15px}
.survey-opts .pick .em{font-size:28px;line-height:1}
textarea.free{width:100%;min-height:120px;border:0;border-radius:var(--r-input);background:var(--sec);padding:14px 16px;font-size:16px;line-height:1.55;resize:vertical;outline:2px solid transparent}
textarea.free:focus{outline:2px solid var(--blue);background:var(--bg)}
.lb{position:fixed;inset:0;z-index:30;background:rgba(17,17,17,.9);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out;animation:viewIn .2s ease}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;background:#fff}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--ink);display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;z-index:20;max-width:calc(100% - 40px);animation:viewIn .2s ease}
.loading{color:var(--sub);padding-block:64px;text-align:center}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-sm);padding:14px 16px;font-size:14px;line-height:1.6}

/* ---- operator (admin) ---- */
.admin{padding-block:12px 64px}
.admin .t-main{font-size:26px}
.btn{border:0;background:var(--blue);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--line);color:var(--hint);cursor:default}
.btn.ghost{background:var(--blue-50);color:var(--blue)}
.btn.sm{padding:8px 12px;font-size:14px;font-weight:600;border-radius:12px}
.btn.danger{background:#FDEEEE;color:var(--err)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;margin:20px 0;overflow-x:auto;padding-bottom:2px}
.tabs button{border:0;background:var(--sec);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;color:var(--sub);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--sec);border-radius:var(--r-sm);padding:16px 18px}
.stat span{font-size:14px;color:var(--sub)}
.stat strong{display:block;font-size:28px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.tbl-wrap{overflow-x:auto;background:var(--bg);border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:13px;color:var(--sub);font-weight:600;background:var(--sec)}
td.n{font-variant-numeric:tabular-nums}
.who{display:flex;gap:8px;align-items:center}
.who img{width:24px;height:24px;border-radius:50%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--blue)} .dot.now{background:#8FA8F0}
.legend{display:flex;gap:14px;font-size:13px;color:var(--sub);margin:12px 0 0;flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}
.ed{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.ed{grid-template-columns:1fr}}
.mlist{display:grid;gap:8px;min-width:0}
.mitem{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--sec);text-align:left;width:100%}
.mitem[aria-current="true"]{background:var(--blue-50);box-shadow:inset 0 0 0 2px var(--blue)}
.mitem .t{font-size:14px;font-weight:600;line-height:1.4;min-width:0;color:var(--ink)}
.mitem .chips{margin-top:6px}
.mitem .chip{font-size:12px;padding:5px 7px;background:var(--bg)}

/* Tap guides on step images: {hl=x,y,w,h;…} draws a dashed box with a tap pulse, {tap=x,y,w,h} pulses only (values are % of the image). */

  const out=[]; if (!str) return out;

    const m=part.match(/^(hl|tap)=(.+)$/); if (!m) continue;

function parseBlocks(text){
  const out=[]; const lines=(text||'').replace(/\r/g,'').split('\n'); let i=0;

    if (L.startsWith('### ')){ out.push({t:'h3',text:L.slice(4)}); i++; continue; }
    if (L.startsWith('?> ')){
      const q=L.slice(3); const items=[]; i++;

/* A lesson is split into short pages: an intro, one page per section, one page per illustrated step

/* ---------- routing ---------- */
function parseHash(){ const t=(location.hash||'').slice(1); const m=t.match(/^(.+)\.(\d+)$/); return m?{id:m[1],page:+m[2],raw:t}:{id:t,page:null,raw:t}; }
function route(){
  const {id,page,raw}=parseHash();
  setChrome(false);
  if (S.admin && S.mode==='admin') return renderAdmin();
  if (!S.modules || S.myCode===undefined) return paint(h('div',{class:'loading'},'불러오는 중이에요…'));
  const mod=S.modules.find(m=>m.id===id);
  if (mod && (S.admin || (hasCode() && myMods().includes(mod)))) return renderLesson(mod, page??0);
  if (!hasCode()) return raw==='code' ? renderCode() : renderLanding();
  if (raw==='code') return renderCode();
  if (raw==='welcome') return renderLanding();
  if (raw==='intro') return renderIntro();
  if (raw==='survey') return renderSurvey();
  if (raw==='done') return renderDone();
  if (raw==='cert') return renderCert();
  renderHome();
}
function go(hash){ if (location.hash==='#'+hash) route(); else location.hash=hash; }
window.addEventListener('hashchange', ()=>{ if (S.mode==='admin' && location.hash && location.hash!=='#admin') setMode('learn',true); route(); window.scrollTo(0,0); });

  S.mode=mode; $('#mLearn').setAttribute('aria-pressed',mode==='learn'); $('#mAdmin').setAttribute('aria-pressed',mode==='admin');
  $('#shell').classList.toggle('wide',mode==='admin');
  if (!silent){ if (mode==='admin') history.replaceState(null,'','#admin'); else if (location.hash==='#admin') history.replaceState(null,'','#home'); route(); window.scrollTo(0,0); }
}

  const btn=h('button',{class:'cta',type:'submit',form:'codeForm',disabled:true},'확인');
  inp.addEventListener('input',()=>{ btn.disabled=normCode(inp.value).length<4; err.hidden=true; inp.classList.remove('bad'); });
  const form=h('form',{id:'codeForm',onsubmit:async e=>{
    e.preventDefault(); const raw=normCode(inp.value); if (raw.length<4) return;

let codeUnsub=null;
async function applyCode(key,data){
  S.myCode={key,...data};
  if (!S.prog) S.prog={m:{}};
  if (S.prog.codeKey!==key){ S.prog.codeKey=key; S.prog.completedAt=null; saveProg(); }
  lsSet('thp-code',key); watchCode(key);
}
function watchCode(key){
  if (codeUnsub) codeUnsub();
  codeUnsub=S.db.doc('codes/'+key).onSnapshot(s=>{
    const before=JSON.stringify(myDevices()), was=hasCode();
    S.myCode=s.exists?{key,...s.data()}:null;
    if (S.mode!=='admin' && S.view!=='code' && S.view!=='lesson' && (JSON.stringify(myDevices())!==before || hasCode()!==was)) route();
  },()=>{});
}

function videoPlayer(m, onPct, onDur){

  v.addEventListener('seeking',()=>{ last=v.currentTime; });
  v.addEventListener('timeupdate',()=>{
    const t=v.currentTime; if (t-last>0 && t-last<1.6){ for(let s=Math.floor(last);s<=Math.floor(t);s++) seen.add(s); } last=t;
    if (!v.duration || !isFinite(v.duration)) return;
    const pct=Math.min(100,Math.round(seen.size/Math.ceil(v.duration)*100));
    if (!mp(m.id).video) onPct(Math.max(pct,saved));
    if (pct>=50 && !mp(m.id).video){ mark(m.id,'video'); onPct(pct); }
    else if (pct>saved+10 && Date.now()-lastSave>8000){ saved=pct; lastSave=Date.now(); mark(m.id,'videoPct',pct); }
  });

  return v;
}

    save.disabled=true; try{ await S.db.doc('modules/'+d.id).set(out); S.dirty=false; d._new=false; toast('저장했습니다.'); }catch(e){ toast(e&&e.code==='invalid_argument'?'저장 권한이 없습니다. 편집 권한(Editor 이상)이 필요합니다.':'저장하지 못했습니다. 잠시 후 다시 시도해 주세요.'); } save.disabled=false;
  }},'저장');
  const del=h('button',{class:'btn danger sm',type:'button',onclick:async()=>{
    if (Date.now()-delArm>4000){ delArm=Date.now(); del.textContent='한 번 더 누르면 삭제'; return; }
    if (!d._new) try{ await S.db.doc('modules/'+d.id).delete(); }catch(e){ return toast('삭제하지 못했습니다.'); }
    S.editId=null; S.draft=null; S.dirty=false; toast('과정을 삭제했습니다.'); renderAdmin(); }},'과정 삭제');
  return h('div',{class:'panel'},
    h('div',{class:'two'},fld('과정 제목',inp('title'),'f_title'),fld('분류 (예: 연속혈당측정기)',inp('kicker'),'f_kick')),
    fld('한 줄 소개 (목록에 표시)',inp('summary'),'f_sum'),
    h('div',{class:'two'},fld('대상 기기',device,'f_dev'),fld('공개 상태',status,'f_status')),
    fld('읽는 시간(분)',minutes,'f_min'),
    fld('출처 (검증된 자료명)',inp('source','예: 케어센스 에어 제품사용설명서'),'f_src'),
    h('div',{class:'fld'},h('label',null,'대표 이미지'),coverBox),
    h('div',{class:'sectitle'},'매거진 본문'),
    h('div',{class:'row'},insImg, h('a',{href:'#'+d.id,onclick:e=>{ if(d._new){e.preventDefault();return toast('먼저 저장해 주세요.');} setMode('learn',true); }},'참여자 화면으로 미리 보기')),
    fld('본문',ta,'f_body'),
    h('div',{class:'hint'},'작성 규칙: ',h('code',null,'## 소제목'),' (소제목마다 화면이 나뉘어요) · ',h('code',null,'- 목록'),' · ',h('code',null,'1. 단계 설명'),' (연속된 단계는 좌우로 넘기는 카드가 되고, 줄 끝에 이미지를 넣으면 단계 사진이 됩니다) · ',h('code',null,'> 알아두세요'),' · ',h('code',null,'!> 주의해주세요'),' · ',h('code',null,'+> 잘하셨어요'),' · ',h('code',null,'?> 질문'),' 다음 줄부터 ',h('code',null,'[ ] 항목'),' (체크리스트) · ',h('code',null,'**강조**'),' · 이미지 줄을 연달아 쓰면 사진이 나란히 배치됩니다. · 이미지 줄 끝에 ',h('code',null,'{30%}'),'처럼 쓰면 그 크기로 줄어듭니다.'),
    h('div',{class:'sectitle'},'영상'),
    fld('영상 제목',inp('videoTitle','예: CGM 1번 · 부착 방법'),'f_vt'), vidBox,
    h('div',{class:'sectitle'},'확인 퀴즈'), quizBox,
    h('div',{class:'row',style:'justify-content:space-between;border-top:1px solid var(--line);padding-top:14px'},del,save));
}

/* ---------- boot ---------- */
async function boot(){
  const cl=window.claude;
  if (!cl || !cl.use){ paint(h('div',{class:'loading gut'},'이 페이지는 claude.ai에서 열어야 교육 콘텐츠가 보여요.')); return; }
  const [db,user,assets,downloads]=await Promise.all(['db','user','assets','downloads'].map(n=>cl.use(n).catch(()=>null)));
  S.db=db; S.user=user; S.assets=assets; S.downloads=downloads;
  if (!db){ paint(h('div',{class:'loading gut'},'교육 콘텐츠를 불러올 수 없어요. claude.ai에 로그인한 상태로 다시 열어주세요.')); return; }
  S.uid=user?await user.id():null; S.admin=user?await user.canEdit():false;
  if (S.admin){ $('#modeSeg').hidden=false; if (location.hash==='#admin') setMode('admin',true); }
  db.collection('modules').orderBy('order').onSnapshot(snap=>{
    S.modules=snap.docs.map(d=>({id:d.id,...d.data()}));
    const busy=[...document.querySelectorAll('#app video')].some(v=>!v.paused) || S.view==='lesson' || S.view==='survey' || S.view==='code';
    if (S.view==='admin' && S.adminTab==='content'){ if(!S.dirty){ S.draft=null; renderAdmin(); } }
    else if (S.view==='admin') renderAdmin();
    else if (!busy) route();
  },()=>paint(h('div',{class:'loading gut'},'교육 콘텐츠를 불러오지 못했어요. 페이지를 새로 고쳐주세요.')));
  const resolveCode=async key=>{
    if (!key){ S.myCode=null; return; }
    try{ const s=await db.doc('codes/'+key).get(); S.myCode=s.exists?{key,...s.data()}:null; }catch{ S.myCode=null; }
    if (S.myCode){ watchCode(key); if (S.prog && S.uid && S.prog.codeKey!==key){ S.prog.codeKey=key; saveProg(); } }
  };
  if (S.uid){ let first=true;
    db.doc('progress/'+S.uid).onSnapshot(async s=>{
      if (s.metadata.hasPendingWrites && S.progLoaded) return;
      if (!first && pageT) return;
      S.prog=s.exists?JSON.parse(JSON.stringify(s.data())):{m:{}}; S.progLoaded=true;
      if (first){ first=false; await resolveCode(S.prog.codeKey||lsGet('thp-code')); route(); }
      else if (S.modules) refreshStatus();
    }, async()=>{ S.prog={m:{}}; await resolveCode(lsGet('thp-code')); route(); });
  } else { S.prog={m:{}}; await resolveCode(lsGet('thp-code')); route(); }
  if (S.admin){
    db.collection('progress').onSnapshot(snap=>{ S.all=snap.docs.map(d=>({id:d.id,...d.data()})); if (S.view==='admin'&&S.adminTab==='status') renderAdmin(); },()=>{ S.all=[]; });
    db.collection('codes').onSnapshot(snap=>{ S.codesPub=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()])); if (S.view==='admin'&&S.adminTab==='status') renderAdmin(); },()=>{});
    db.collection('codebook').onSnapshot(snap=>{ S.codebook=snap.docs.map(d=>({id:d.id,...d.data()})); if (S.view==='admin'&&S.adminTab==='codes') renderAdmin(); },()=>{ S.codebook=[]; });
  }
}
boot();
})();
